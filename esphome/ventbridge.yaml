substitutions:
  name: ventbridge
  # Seeed Studio XIAO ESP32-C6.
  board: seeed_xiao_esp32c6
  # Overridden per build with `-s version <git tag>`; see scripts/esphome_targets.py.
  version: dev

esphome:
  name: ${name}
  project:
    name: pespiri.ventbridge
    version: ${version}

# The driver core is a plain ESP-IDF component, so the esp-idf framework is required.
# vent_bridge registers it, and its logging sdkconfig options, automatically.
esp32:
  board: ${board}
  framework:
    type: esp-idf
    version: 6.1.0

external_components:
  - source:
      type: local
      path: ../components
    components: [vent_bridge]

vent_bridge:
  id: vent
  uart_port: 1
  rx_pin: GPIO17
  tx_pin: GPIO19
  baud_rate: 4800
  air_temp_up_pin: GPIO01
  air_temp_down_pin: GPIO02
  airflow_up_pin: GPIO23
  airflow_down_pin: GPIO22
  filter_pin: GPIO21

select:
  - platform: vent_bridge
    type: airflow
    name: "Airflow"
  - platform: vent_bridge
    type: air_temp
    name: "Temperature"

button:
  - platform: vent_bridge
    type: airflow_up
    name: "Airflow up"
  - platform: vent_bridge
    type: airflow_down
    name: "Airflow down"
  - platform: vent_bridge
    type: air_temp_up
    name: "Temperature up"
  - platform: vent_bridge
    type: air_temp_down
    name: "Temperature down"
  - platform: vent_bridge
    type: filter_long
    name: "Filter reset"

binary_sensor:
  - platform: vent_bridge
    type: summer_operation
    name: "Summer operation"
  - platform: vent_bridge
    type: filter_change
    name: "Filter change"
  - platform: vent_bridge
    type: heater_battery
    name: "Heater battery"
    # The panel reuses this LED to acknowledge a setting change, flashing it at
    # ~5Hz. Ride over that so the entity reads steadily rather than flapping,
    # at the cost of reporting a genuine heater-off up to 5s late.
    filters:
      - delayed_off: 5s
  - platform: vent_bridge
    type: filter_reset
    name: "Filter reset detected"
    entity_category: diagnostic
    # The panel keeps its own timer but never puts it on the bus, so the
    # reset date is recorded here. This fires on the button frame the panel itself
    # emits, so it covers presses made at the wall panel as well as via HA - and
    # unlike watching the alarm clear, it works even if the alarm was never lit.
    on_press:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) id(filter_reset_epoch) = now.timestamp;
  - platform: vent_bridge
    type: online
    name: "Panel online"
    device_class: connectivity

# switch:
#   - platform: vent_bridge
#     name: "Frame trace"

time:
  - platform: homeassistant
    id: ha_time
    # The filter sensors' template lambdas need time and a restored global, both of
    # which are only ready after this fires - without it they'd sit at "unknown"
    # until the next hourly poll happens to land after time is valid.
    on_time_sync:
      - lambda: |-
          id(filter_interval_sensor).update();
          id(filter_days_sensor).update();

globals:
  # Unix time of the last filter reset; survives reboots. 0 means never seen one.
  - id: filter_reset_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # The panel only reveals the interval during a confirmation blink, so latch it
  # when seen and keep it across reboots.
  - id: filter_interval_months
    type: uint8_t
    restore_value: true
    initial_value: "0"

interval:
  - interval: 30s
    then:
      - lambda: |-
          uint8_t months = id(vent)->filter_interval_months();
          // Publish on the spot: the sensors poll hourly, which is far too slow
          // to reflect a change the user just made at the panel.
          if (months != 0 && months != id(filter_interval_months)) {
            id(filter_interval_months) = months;
            id(filter_interval_sensor).update();
            id(filter_days_sensor).update();
          }

sensor:
  - platform: template
    name: "Filter interval"
    id: filter_interval_sensor
    unit_of_measurement: months
    state_class: measurement
    icon: mdi:calendar-range
    accuracy_decimals: 0
    update_interval: 1h
    lambda: |-
      if (id(filter_interval_months) == 0) return {};
      return id(filter_interval_months);

  - platform: template
    name: "Filter days remaining"
    id: filter_days_sensor
    unit_of_measurement: d
    device_class: duration
    state_class: measurement
    icon: mdi:air-filter
    accuracy_decimals: 0
    update_interval: 1h
    lambda: |-
      if (id(filter_reset_epoch) == 0) return {};
      auto now = id(ha_time).now();
      if (!now.is_valid()) return {};
      // Until an interval has been observed, assume the 12-month maximum rather
      // than reporting a countdown that is certainly wrong.
      uint8_t months = id(filter_interval_months) ? id(filter_interval_months) : 12;
      int32_t elapsed = (int32_t)(now.timestamp - id(filter_reset_epoch));
      return (months * 30.4375f) - (elapsed / 86400.0f);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

api:
  encryption:
    key: !secret api_key

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password
