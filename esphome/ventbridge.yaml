substitutions:
  name: ventbridge
  # Swap to esp32-c6-devkitc-1 (or your C6 board) when the hardware arrives.
  board: seeed_xiao_esp32s3
  # Overridden per build with `-s version <git tag>`; see scripts/esphome_targets.py.
  version: dev

esphome:
  name: ${name}
  project:
    name: pespiri.ventbridge
    version: ${version}

# The driver core is a plain ESP-IDF component, so the esp-idf framework is required.
# vent_bridge registers it, and its logging sdkconfig options, automatically.
esp32:
  board: ${board}
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [vent_bridge]

vent_bridge:
  id: vent
  uart_port: 1
  rx_pin: GPIO8
  tx_pin: GPIO9
  baud_rate: 4800
  fan_up_pin: GPIO2
  fan_down_pin: GPIO3
  temp_up_pin: GPIO4
  temp_down_pin: GPIO5
  filter_pin: GPIO6

select:
  - platform: vent_bridge
    type: fan
    name: "Fan speed"
  - platform: vent_bridge
    type: temperature
    name: "Heat recovery"

button:
  - platform: vent_bridge
    type: fan_up
    name: "Fan up"
  - platform: vent_bridge
    type: fan_down
    name: "Fan down"
  - platform: vent_bridge
    type: temp_up
    name: "Temperature up"
  - platform: vent_bridge
    type: temp_down
    name: "Temperature down"
  - platform: vent_bridge
    type: filter_long
    name: "Filter reset"

binary_sensor:
  - platform: vent_bridge
    type: summer
    name: "Summer mode"
  - platform: vent_bridge
    type: notification
    name: "Panel notification"
    # Blinks at ~5Hz during the post-filter-reset animation; ride over it so the
    # entity reads steadily rather than flapping across the API.
    filters:
      - delayed_off: 5s
  - platform: vent_bridge
    type: filter_reset
    name: "Filter reset detected"
    entity_category: diagnostic
    # The panel keeps its own 365-day timer but never puts it on the bus, so the
    # reset date is recorded here. This fires on the button frame the panel itself
    # emits, so it covers presses made at the wall panel as well as via HA - and
    # unlike watching the alarm clear, it works even if the alarm was never lit.
    on_press:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) id(filter_reset_epoch) = now.timestamp;
  - platform: vent_bridge
    type: online
    name: "Panel online"
    device_class: connectivity

# switch:
#   - platform: vent_bridge
#     name: "Frame trace"

time:
  - platform: homeassistant
    id: ha_time

globals:
  # Unix time of the last filter reset; survives reboots. 0 means never seen one.
  - id: filter_reset_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"

sensor:
  - platform: template
    name: "Filter days remaining"
    unit_of_measurement: d
    device_class: duration
    state_class: measurement
    icon: mdi:air-filter
    accuracy_decimals: 0
    update_interval: 1h
    lambda: |-
      if (id(filter_reset_epoch) == 0) return {};
      auto now = id(ha_time).now();
      if (!now.is_valid()) return {};
      int32_t elapsed = (int32_t)(now.timestamp - id(filter_reset_epoch));
      return 365.0f - (elapsed / 86400.0f);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

api:
  encryption:
    key: !secret api_key

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password
